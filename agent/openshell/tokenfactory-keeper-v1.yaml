# OpenShell provider profile: lets Keeper's router in the sandbox call any
# Nemotron model on Token Factory, while the real API key stays in the
# OpenShell gateway. The sandbox sees TOKENFACTORY_API_KEY only as a
# placeholder, and OpenShell swaps in the key at these endpoints only.
# Modeled on NemoClaw's tavily-hermes-v1 profile.
id: tokenfactory-keeper-v1
display_name: Nebius Token Factory for Keeper
description: Nemotron chat completions on Nebius Token Factory for Keeper's model router
category: inference
credentials:
  - name: api_key
    description: Nebius Token Factory API key
    env_vars:
      - TOKENFACTORY_API_KEY
    required: true
    auth_style: bearer
    header_name: authorization
discovery:
  credentials: [api_key]
endpoints:
  - host: api.tokenfactory.us-central1.nebius.com
    port: 443
    protocol: rest
    enforcement: enforce
    rules:
      - allow: { method: POST, path: "/v1/chat/completions" }
      - allow: { method: GET, path: "/v1/models" }
binaries:
  - /opt/hermes/.venv/bin/python
inference_capable: false
